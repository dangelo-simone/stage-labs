apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: lab3-elk
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/dangelo-simone/stage-labs
    targetRevision: HEAD
    path: kubernetes/lab3/overlays/dev
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
