apiVersion: v1
kind: Service
metadata:
  name: wordpress
  namespace: wp1
spec:
  type: NodePort
  selector:
    app: wordpress
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30081
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wordpress
  namespace: wp1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: wordpress
  template:
    metadata:
      labels:
        app: wordpress
    spec:
      containers:
        - name: wordpress
          image: docker.io/library/wordpress:7.0-php8.4-apache
          env:
            - name: WORDPRESS_DB_HOST
              value: mariadb
            - name: WORDPRESS_DB_USER
              value: wordpress
            - name: WORDPRESS_DB_NAME
              value: wordpress
            - name: WORDPRESS_DB_PASSWORD
              valueFrom:
                secretKeyRef: { name: mariadb-secret, key: db_password }
          ports:
            - containerPort: 80
          resources:
            requests: { memory: 256Mi }
            limits: { memory: 512Mi }
          volumeMounts:
            - name: apache-logs
              mountPath: /var/log/apache2
        - name: filebeat
          image: docker.elastic.co/beats/filebeat:9.4.4
          args: ["-e", "--strict.perms=false"]
          securityContext:
            runAsUser: 0
          resources:
            requests: { memory: 128Mi }
            limits: { memory: 256Mi }
          volumeMounts:
            - name: apache-logs
              mountPath: /var/log/apache2
              readOnly: true
            - name: filebeat-cfg
              mountPath: /usr/share/filebeat/filebeat.yml
              subPath: filebeat.yml
      volumes:
        - name: apache-logs
          emptyDir: {}
        - name: filebeat-cfg
          configMap:
            name: filebeat
