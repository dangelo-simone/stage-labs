apiVersion: v1
kind: Service
metadata:
  name: mariadb
  namespace: wp1
spec:
  selector:
    app: mariadb
  ports:
    - port: 3306
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mariadb-data
  namespace: wp1
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: local-path
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mariadb
  namespace: wp1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mariadb
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: mariadb
    spec:
      containers:
        - name: mariadb
          image: docker.io/library/mariadb:11.8.8-ubi9
          env:
            - name: MARIADB_DATABASE
              value: wordpress
            - name: MARIADB_USER
              value: wordpress
            - name: MARIADB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef: { name: mariadb-secret, key: root_password }
            - name: MARIADB_PASSWORD
              valueFrom:
                secretKeyRef: { name: mariadb-secret, key: db_password }
          ports:
            - containerPort: 3306
          resources:
            requests: { memory: 256Mi }
            limits: { memory: 512Mi }
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: mariadb-data
