input {
  beats {
    port => 5044
  }
}
filter {
  if [log][file][path] =~ /\/access\.log$/ {
    grok {
      match => {
        "message" => '%{IPORHOST:client_ip} %{HTTPDUSER:ident} %{HTTPDUSER:auth} \[%{HTTPDATE:timestamp}\] "%{WORD:http_method} %{DATA:request} HTTP/%{NUMBER:http_version}" %{NUMBER:status_code:int} (?:%{NUMBER:bytes:int}|-) "%{DATA:referrer}" "%{DATA:user_agent}"'
      }
    }
    date {
      match => [ "timestamp", "dd/MMM/yyyy:HH:mm:ss Z" ]
      target => "@timestamp"
    }
  }
}
output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    ilm_enabled => false
    index => "wordpress-logs"
  }
}
